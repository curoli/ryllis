[package]
name = "ryllis"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
url = "2"

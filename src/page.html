<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <base href="{{path}}">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.65; }
    body { max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; padding-block-end: 1rem; border-block-end: 1px solid GrayText; }
    nav [aria-current] { font-weight: bold; }
    h1, h2, h3 { line-height: 1.2; }
    img { max-width: 100%; }
    pre { overflow: auto; }
  </style>
</head>
<body>
  <nav aria-label="Home and languages">{{navigation}}</nav>
  <main>{{content}}</main>
</body>
</html>
